[package]
name = "nrg-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only resource telemetry collector for Nexus Resource Governor"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
