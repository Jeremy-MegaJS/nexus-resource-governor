# Values are MiB. These are notification thresholds, not enforced limits.
# Format: workload-key=warning_mib,critical_mib
# The adaptive default is 20% / 35% of physical RAM (with 1 GiB / 2 GiB minimums).
# Leave the global override unset to keep the adaptive default.
# default=1536,2560

# Optional per-application overrides; names are normalized from systemd cgroups.
# brave-browser=2048,3072
# chatgpt=2048,3072
# org.chromium.chromium=2048,3072
